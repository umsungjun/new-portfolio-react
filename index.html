<!DOCTYPE html>
<html lang="en">
  <head>
    <title>프론트엔드 개발자 엄성준 React 포트폴리오</title>
    <meta
      name="description"
      content="React로 제작한 프론트엔드 개발자 엄성준의 초기 포트폴리오입니다. 최신 버전은 Next.js 기반 포트폴리오에서 확인하실 수 있습니다."
    />
    <meta
      name="keywords"
      content="프론트엔드 개발자, 엄성준, React 포트폴리오, 포트폴리오, frontend developer, umsungjun, React portfolio"
    />
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 2026-11 보관 처리. 주소는 살려 두고 검색엔진에서만 뺀다. JS 를 안 돌리는 크롤러도 읽게 정적 HTML 에 둔다 -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .register("/sw.js")
          .then((registration) => {
            console.log("Service worker registration succeeded:", registration);
          })
          .catch((err) => {
            console.log("Service worker registration failed:", error);
          });
      } else {
        console.log("Service workers are not supported.");
      }
    </script>
  </body>
</html>
